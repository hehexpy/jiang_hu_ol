# Include within the existing HTTPS server block only.
location = /jianghu/report {
    client_max_body_size 4m;
    client_body_timeout 30s;
    limit_req zone=jianghu_reports burst=3 nodelay;
    proxy_pass http://127.0.0.1:28777;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_set_header Host $host;
    access_log off;
}
