        maven { url 'https://maven.chaquo.com/maven' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

rootProject.name = "jianghu-ol-helper"
include ':app'
